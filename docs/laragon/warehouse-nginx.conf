# Optional Nginx alternative; do not enable Apache and Nginx on the same port.
# Replace IP/path and verify PHP FastCGI port in your Laragon configuration.
server {
    listen 8443 ssl;
    server_name warehouse-stock.test 192.168.1.10;
    root C:/laragon/www/warehouse-stock/public;
    index index.php;
    ssl_certificate C:/laragon/etc/ssl/warehouse/warehouse.pem;
    ssl_certificate_key C:/laragon/etc/ssl/warehouse/warehouse-key.pem;
    client_max_body_size 8m;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ ^/index\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass 127.0.0.1:9000;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
