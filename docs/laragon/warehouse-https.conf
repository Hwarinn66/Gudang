# Example only: replace IP and paths before enabling. Listen 8443 exactly once.
# Requires mod_ssl, mod_socache_shmcb and mod_rewrite.
# Keep certificates outside the web root.
Listen 8443
<VirtualHost *:8443>
    ServerName 192.168.1.10
    ServerAlias warehouse-stock.test
    DocumentRoot "C:/laragon/www/warehouse-stock/public"
    SSLEngine on
    SSLCertificateFile "C:/laragon/etc/ssl/warehouse/warehouse.pem"
    SSLCertificateKeyFile "C:/laragon/etc/ssl/warehouse/warehouse-key.pem"
    <Directory "C:/laragon/www/warehouse-stock/public">
        AllowOverride All
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>
</VirtualHost>
