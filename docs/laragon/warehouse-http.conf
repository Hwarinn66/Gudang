# Example Apache VirtualHost. Update paths to your Laragon installation.
# Save as C:/laragon/etc/apache2/sites-enabled/warehouse-stock.conf
# Remove/disable the duplicate auto.warehouse-stock.test.conf if present.
<VirtualHost *:80>
    ServerName warehouse-stock.test
    DocumentRoot "C:/laragon/www/warehouse-stock/public"
    <Directory "C:/laragon/www/warehouse-stock/public">
        AllowOverride All
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>
</VirtualHost>
